[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excaliflow-studio"
version = "0.1.3"
description = "Local-first code intelligence and presentation-ready visual generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "graphifyy>=0.9.0",
]

[project.scripts]
excaliflow = "excaliflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
scripts = ["scripts/generate_diagram.py"]
"assets/vendor" = ["assets/vendor/mermaid.min.js", "assets/vendor/panzoom.min.js"]
