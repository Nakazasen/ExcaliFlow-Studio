[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excaliflow-studio"
version = "0.1.1"
description = "Local-first code intelligence and presentation-ready visual generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
excaliflow = "excaliflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
