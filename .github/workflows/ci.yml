name: CI & Sync Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Test Suite (with Sync & Error Handling Tests)
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Offline Runtime & Generator
        run: |
          python scripts/generate_diagram.py --offline-check
          python scripts/generate_diagram.py --dir . --out ci_viewer.html --with-excalidraw
