name: Publish Windows setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the requested tag exists
        shell: pwsh
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"

      - name: Run the test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/src"
          py -3 -m unittest discover -s tests -v

      - name: Build the portable Windows setup
        shell: pwsh
        run: .\installers\build-windows-release.ps1

      - name: Create or update the GitHub Release asset
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "ExcaliFlow $env:RELEASE_TAG" --generate-notes
          }
          gh release upload $env:RELEASE_TAG .\dist\ExcaliFlow-Setup-windows.zip --clobber
