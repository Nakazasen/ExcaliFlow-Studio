name: Publish Windows setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the requested tag exists
        shell: pwsh
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $bundleVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($bundleVersion -ne $expectedVersion) {
            throw "Release tag does not match VERSION: tag=$expectedVersion VERSION=$bundleVersion"
          }

      - name: Run the test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/src"
          py -3 -m unittest discover -s tests -v

      - name: Build the portable Windows setup
        shell: pwsh
        run: .\installers\build-windows-release.ps1

      - name: Create or update the GitHub Release asset
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "ExcaliFlow $env:RELEASE_TAG" --generate-notes
          }
          $version = $env:RELEASE_TAG.TrimStart('v')
          $releasePage = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          $asset = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/ExcaliFlow-Setup-windows.zip"
          @{
            schema_version = "excaliflow-update/v1"
            version = $version
            release_notes_url = $releasePage
            asset_url = $asset
          } | ConvertTo-Json | Set-Content -LiteralPath .\dist\update.json -Encoding utf8
          gh release upload $env:RELEASE_TAG .\dist\ExcaliFlow-Setup-windows.zip .\dist\update.json --clobber

  signed-exe:
    needs: release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Check whether optional EXE signing is configured
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:SIGNING_TIMESTAMP_URL)) {
            Write-Output "EXE signing is not configured; skipping optional EXE artifact."
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out the exact release tag
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Restore the protected signing certificate
        if: ${{ steps.signing.outputs.ready == 'true' }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\excaliflow-signing.pfx", $bytes)

      - name: Build, sign, and verify the EXE
        if: ${{ steps.signing.outputs.ready == 'true' }}
        shell: pwsh
        run: |
          .\installers\build-windows-exe.ps1 -PfxPath "$env:RUNNER_TEMP\excaliflow-signing.pfx" -PfxPassword $env:SIGNING_PFX_PASSWORD -TimestampUrl $env:SIGNING_TIMESTAMP_URL -RequireSignature

      - name: Upload the verified signed EXE
        if: ${{ steps.signing.outputs.ready == 'true' }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG .\dist\ExcaliFlow-Setup-windows.exe --clobber
